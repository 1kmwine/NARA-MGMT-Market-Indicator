services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    # 외부에 포트를 노출하지 않는다 — web 컨테이너만 내부 네트워크로 호출.

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3002:3001"
    depends_on:
      - backend
    restart: unless-stopped
